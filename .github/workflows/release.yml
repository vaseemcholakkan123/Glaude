name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check the mod's version matches the tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('mod/.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "mod/.claude-plugin/plugin.json says $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build Glaude.app
        run: ./app/build.sh

      - name: Zip the app
        run: ditto -c -k --keepParent app/build/Glaude.app "Glaude-${GITHUB_REF_NAME}-macos-arm64.zip"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Glaude-${GITHUB_REF_NAME}-macos-arm64.zip" --title "Glaude ${GITHUB_REF_NAME}" --notes-file notes.md
