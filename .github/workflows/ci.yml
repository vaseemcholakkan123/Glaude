name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Build the app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Glaude.app
        run: ./app/build.sh

  mod:
    name: Validate the mod
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace, manifest and hooks module
        run: claude plugin validate .
      # `claude plugin test` isn't available on a runner that isn't signed in to
      # Claude Code, so the mod's tests run locally (see CONTRIBUTING.md).
