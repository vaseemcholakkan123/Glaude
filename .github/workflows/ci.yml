name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Build the app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Glaude.app
        run: ./app/build.sh
      - name: Launch it and check it stays up
        run: |
          app/build/Glaude.app/Contents/MacOS/Glaude &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; echo "Glaude exited at launch (status $?)" >&2; exit 1
          fi
          kill "$pid"

  mod:
    name: Validate the mod
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace, manifest and hooks module
        run: claude plugin validate .
      # `claude plugin test` isn't available on a runner that isn't signed in to
      # Claude Code, so the mod's tests run locally (see CONTRIBUTING.md).
